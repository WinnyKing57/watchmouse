apply plugin: 'com.android.application'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def reportProperties = new Properties()
def reportPropertiesFile = rootProject.file("secrets.properties")
if (reportPropertiesFile.exists()) {
    reportProperties.load(new FileInputStream(reportPropertiesFile))
}

android {
    namespace 'com.winnyking.watchmouse'
    compileSdk 35
    ndkVersion "26.1.10909125"

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.winnyking.watchmouse"
        minSdkVersion 34
        targetSdkVersion 34
        versionCode 46
        versionName "1.33"
        buildConfigField "String", "REPORT_ENDPOINT", "\"${reportProperties.getProperty("reportUrl", "")}\""
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_ARM_NEON=TRUE", "-DANDROID_TOOLCHAIN=clang"
                cppFlags.addAll([
                    "-std=c++17",
                    "-Os",
                    "-ffunction-sections",
                    "-fdata-sections",
                    "-fvisibility=hidden",
                ])
            }
        }
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            stl "libc++"
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            proguardFiles 'proguard-rules.pro'
        }
    }
    compileOptions {
        targetCompatibility JavaVersion.VERSION_17
        sourceCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkReleaseBuilds true
        abortOnError true
    }
    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            universalApk true
        }
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.guava:guava:33.4.0-android'
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-process:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.8.6'
    implementation 'androidx.wear:wear:1.3.0'
    implementation 'androidx.wear:wear-input:1.2.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
}
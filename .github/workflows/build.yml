name: Build

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses + install NDK
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "ndk;26.1.10909125"
          yes | "$SDKMGR" --licenses > /dev/null || true

      - name: Build debug APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
      - run: ./gradlew :app:assembleDebug

      - name: Run lint
        run: ./gradlew :app:lintVitalRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: watchmouse-apks
          path: app/build/outputs/apk/**/*.apk

  companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null || true

      - name: Build companion debug APK
        run: |
          cd companion
          ./gradlew :assembleDebug --no-daemon

      - name: Upload companion APK
        uses: actions/upload-artifact@v4
        with:
          name: watchmouse-companion-apk
          path: companion/build/outputs/apk/**/*.apk
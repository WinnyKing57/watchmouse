name: Build

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null || true

      - name: JVM unit tests (crypto vectors)
        run: ./gradlew :app:testDebugUnitTest

      - name: Python protocol tests (host)
        run: |
          python3 -m venv /tmp/wmtest
          /tmp/wmtest/bin/pip -q install pytest python-uinput cryptography
          /tmp/wmtest/bin/pytest -q host/linux/test_watchmouse_proto.py -p no:cacheprovider

  build:
    runs-on: ubuntu-latest
    needs: [ test ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses + install NDK
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "ndk;26.1.10909125"
          yes | "$SDKMGR" --licenses > /dev/null || true

      - name: Configure release signing
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/watchmouse.jks
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$GITHUB_WORKSPACE/keystore/watchmouse.jks" \
              "$KEYSTORE_STORE_PASSWORD" "$KEY_ALIAS" "$KEYSTORE_KEY_PASSWORD" > keystore.properties
            echo "::notice::Release signing configured with production keystore"
          else
            echo "::warning::No keystore secrets -> release APKs will be debug-signed (not OTA-installable)"
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}

      - name: Build release APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
      - run: ./gradlew :app:assembleRelease

      - name: Run lint
        run: ./gradlew :app:lintVitalRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: watchmouse-apks
          path: app/build/outputs/apk/**/*.apk

  companion:
    runs-on: ubuntu-latest
    needs: [ test ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null || true

      - name: Build companion debug APK
        run: |
          cd companion
          ./gradlew :assembleDebug --no-daemon

      - name: Upload companion APK
        uses: actions/upload-artifact@v4
        with:
          name: watchmouse-companion-apk
          path: companion/build/outputs/apk/**/*.apk

  deb:
    runs-on: ubuntu-latest
    needs: [ test ]
    steps:
      - uses: actions/checkout@v4

      - name: Build .deb package (WatchMouse Linux host)
        run: ./host/linux/build-deb.sh

      - name: Verify .deb contents
        run: dpkg-deb -c host/linux/build-deb/*.deb

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: watchmouse-host-deb
          path: host/linux/build-deb/*.deb

  release:
    runs-on: ubuntu-latest
    needs: [ build, companion, deb ]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Prepare release assets
        run: |
          mkdir -p assets
          VERSION="${{ github.ref_name }}"
          find release-assets/watchmouse-apks -name 'app-universal-release.apk' \
            -exec cp {} "assets/watchmouse-universal-$VERSION.apk" \;
          find release-assets/watchmouse-companion-apk -maxdepth 6 -name '*.apk' \
            -exec cp {} "assets/watchmouse-companion-$VERSION.apk" \;
          find release-assets/watchmouse-host-deb -name '*.deb' \
            -exec cp {} "assets/watchmouse-host-$VERSION.deb" \;
          ls -la assets

      - name: Create GitHub release
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" assets/* --clobber
            echo "Release already exists; uploaded/clobbered assets."
          else
            gh release create "${{ github.ref_name }}" assets/* --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}